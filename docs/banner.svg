<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Claude Cockpit">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a18"/>
      <stop offset="100%" stop-color="#0f0f0e"/>
    </linearGradient>
    <linearGradient id="barra" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d97757"/>
    </linearGradient>
    <linearGradient id="linea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d97757" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="260" rx="10" fill="url(#fondo)"/>

  <!-- grilla tenue, como la del panel -->
  <g stroke="#2c2c29" stroke-width="1" opacity="0.55">
    <path d="M0 65 H1000 M0 130 H1000 M0 195 H1000"/>
    <path d="M200 0 V260 M400 0 V260 M600 0 V260 M800 0 V260"/>
  </g>

  <!-- el mismo icono de la app: cuadrado redondeado y tres barras -->
  <g transform="translate(56,86)">
    <rect width="88" height="88" rx="20" fill="#d97757"/>
    <rect x="20" y="46" width="12" height="26" rx="3" fill="#1a0f0a"/>
    <rect x="38" y="34" width="12" height="38" rx="3" fill="#1a0f0a"/>
    <rect x="56" y="22" width="12" height="50" rx="3" fill="#1a0f0a"/>
  </g>

  <text x="176" y="118" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="40" font-weight="700" fill="#ece9e3">
    Claude Cockpit
  </text>
  <text x="178" y="152" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="16.5" fill="#918c81">
    Todo lo que Claude Code deja en tu disco, en una sola pantalla.
  </text>
  <text x="178" y="178" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="16.5" fill="#918c81">
    Local, sin backend, sin telemetría.
  </text>

  <!-- mini grafico decorativo a la derecha -->
  <g transform="translate(700,66)">
    <rect x="0"   y="72" width="16" height="46"  rx="3" fill="url(#barra)"/>
    <rect x="26"  y="48" width="16" height="70"  rx="3" fill="url(#barra)"/>
    <rect x="52"  y="86" width="16" height="32"  rx="3" fill="url(#barra)"/>
    <rect x="78"  y="26" width="16" height="92"  rx="3" fill="url(#barra)"/>
    <rect x="104" y="58" width="16" height="60"  rx="3" fill="url(#barra)"/>
    <rect x="130" y="10" width="16" height="108" rx="3" fill="url(#barra)"/>
    <rect x="156" y="40" width="16" height="78"  rx="3" fill="url(#barra)"/>
    <rect x="182" y="66" width="16" height="52"  rx="3" fill="url(#barra)"/>
    <path d="M0 124 H198" stroke="#2c2c29" stroke-width="1.5"/>
  </g>

  <rect x="0" y="258" width="1000" height="2" fill="url(#linea)"/>
</svg>
